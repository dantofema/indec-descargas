<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Descargar un objeto del Marco Geoestadístico — INDEC</title>
    <meta name="description" content="La ficha de un objeto del Marco Geoestadístico Nacional del INDEC: su mapa, de qué forma parte, qué contiene y las descargas en GeoPackage de cada capa." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-pagina="resultados">
    <!--#shell:header-->

    <main>
      <div class="search">
        <div class="search-row">
          <!-- Las opciones las llena el buscador desde TYPE_ORDER y TYPES:
               el orden y las etiquetas tienen una sola fuente. -->
          <select id="type" aria-label="Tipo de objeto"></select>
          <input
            id="q"
            type="search"
            autocomplete="off"
            placeholder="Escribí un nombre. Por ejemplo: Tres de Febrero"
            aria-label="Buscar un objeto geográfico"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="results"
            aria-expanded="false"
          />
        </div>
        <ul id="results" class="results" role="listbox" hidden></ul>
      </div>

      <p id="status" class="status">Cargando el catálogo…</p>

      <section id="detail" class="detail" hidden>
        <div class="row row-identity">
          <div id="map" class="map"></div>
          <div class="identity">
            <div class="identity-head">
              <h2 id="detail-name"></h2>
              <!-- La URL es el estado: lo que se copia es la barra tal cual,
                   con la pestaña abierta incluida. -->
              <button id="copy-link" type="button" class="btn ghost mini">Copiar enlace</button>
            </div>
            <p id="detail-meta" class="meta"></p>
            <div id="detail-self"></div>
          </div>
        </div>

        <div class="row row-bulk">
          <div id="row-parents" hidden>
            <p class="block-title">De qué forma parte</p>
            <ul id="parents" class="rel"></ul>
          </div>
          <div>
            <p class="block-title">Qué contiene, capa entera</p>
            <ul id="children" class="rel"></ul>
          </div>
        </div>

        <div class="row" id="row-browse" hidden>
          <p class="block-title">Recorrer y descargar de a uno</p>
          <div id="browse"></div>
        </div>
      </section>
    </main>

    <!--#shell:cta-->
    <!--#shell:footer-->

    <script type="module" src="/src/pages/resultados.js"></script>
  </body>
</html>
